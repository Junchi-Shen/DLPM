[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-dlpm-finance"
version = "0.1.0"
description = "Conditional Deep Levy path generation and P-Q diagnostics"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "torch",
]

[tool.setuptools]
package-dir = {"" = "src/dlpm"}

[tool.setuptools.packages.find]
where = ["src/dlpm"]

